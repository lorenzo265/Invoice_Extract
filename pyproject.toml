[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-extractor"
version = "0.1.0"
description = "Evidence-backed extraction of structured data from PDF invoices."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.24"]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8", "pytest-cov>=5", "pre-commit>=3.7"]

[project.scripts]
invoice-extractor = "invoice_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
invoice_extractor = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# docs/reference holds material reproduced verbatim as a specification by example.
# Formatting it would change the specification.
extend-exclude = ["docs/reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.11"

[[tool.mypy.overrides]]
module = "fitz"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "--cov=invoice_extractor --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["src/invoice_extractor"]
