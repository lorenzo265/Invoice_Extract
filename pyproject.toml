[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-extractor"
version = "0.4.0"
description = "Evidence-backed extraction of structured data from PDF invoices."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PyMuPDF>=1.24"]
# `invoice_forge`, the generator this engine is proved against, is a separate
# distribution under `tools/forge/`: a caller extracting invoices has no use for a
# generator of them, and its embedded fonts are two megabytes of what it would carry.

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8", "pytest-cov>=5", "pre-commit>=3.7"]

[project.scripts]
invoice-extractor = "invoice_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["invoice_extractor*"]

# The vendors this engine knows and the languages they speak travel inside the wheel. An
# engine whose vocabulary is not installed reads nothing, and reports every document as
# `profile_not_detected` — which is also what a genuinely unrecognised invoice gets, so a
# caller could not tell the two apart. `invoice_extractor/bundled.py` is what finds them.
[tool.setuptools.package-data]
invoice_extractor = ["py.typed", "data/profiles/*.json", "data/lexicon/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# docs/reference holds material reproduced verbatim as a specification by example.
# Formatting it would change the specification.
extend-exclude = ["docs/reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# The generator writes invoices in sixteen languages, so a Greek capital alpha and a
# Turkish dotless i are the right characters rather than lookalikes for Latin ones.
# Listed one by one, so a confusable from a script the corpus does not speak is still
# reported as the typo it would be.
allowed-confusables = ["Α", "Β", "Ε", "Ζ", "Η", "Ι", "Κ", "Μ", "Ν", "Ο", "Ρ", "Τ", "Υ", "Χ", "ı", "ο", "ν", "α", "ρ", "τ", "υ", "χ", "ϲ"]

[tool.mypy]
strict = true
files = ["src", "benchmarks"]
python_version = "3.10"

# PyMuPDF ships no annotations. `follow_imports = "skip"` keeps every value it hands back
# an `Any` at the boundary, which is what the two PDF modules then convert into this
# project's own typed values. Analysing it instead would make every call to it an error.
[[tool.mypy.overrides]]
module = "pymupdf"
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts", "."]
addopts = "--cov=invoice_extractor --cov=invoice_forge --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["src/invoice_extractor", "src/invoice_forge"]
